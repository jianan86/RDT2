# Bimanual Piper + Pika hardware mapping for RDT2 async inference.
# Left/right use operator perspective. RDT2 action/state order is right first, left second.
right:
  piper_can: right_piper
  piper_usb_port: "1-1.3:1.0"
  gripper_port: /dev/ttyUSB0
  fisheye_index: 0

left:
  piper_can: left_piper
  piper_usb_port: "1-1.4:1.0"
  gripper_port: /dev/ttyUSB1
  fisheye_index: 1
